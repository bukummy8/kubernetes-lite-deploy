  deploy:
    name: Deploy to K3s
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml
          kubectl apply -f kubernetes/api-servicemonitor.yaml

      - name: Deploy exact commit image
        run: |
          kubectl set image deployment/kubernetes-lite-api \
            kubernetes-lite-api=ghcr.io/bukummy8/kubernetes-lite-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/kubernetes-lite-api --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment kubernetes-lite-api
          kubectl get pods -l app=kubernetes-lite-api
          kubectl get deployment kubernetes-lite-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo

      - name: Verify API health
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:30360/health