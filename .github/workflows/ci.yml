name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run API tests
        working-directory: app
        run: npm test

      - name: Check JavaScript syntax
        working-directory: app
        run: node --check server.js

      - name: Build Docker image
        run: docker build -t kubernetes-lite-api:${{ github.sha }} ./app

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f kubernetes/deployment.yaml
          kubectl apply --dry-run=client --validate=false -f kubernetes/service.yaml
          kubectl apply --dry-run=client --validate=false -f kubernetes/api-servicemonitor.yaml
